<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Life OS — Всё, что важно - под контролем</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="assets/images/home.svg" />
  </head>
  <body>
    <div id="app-loader" class="loader"></div>
    <app-root></app-root>
    <script>
      (function () {
        const darkMode = localStorage.getItem("tuiDark");
        const isDark = (() => {
          try {
            return darkMode ? JSON.parse(darkMode) === true : true;
          } catch {
            return true;
          }
        })();
        document.documentElement.style.background = isDark ? "#222" : "#fff";
        fetch("assets/images/home.svg")
          .then((r) => r.text())
          .then((svg) => {
            const loader = document.getElementById("app-loader");
            loader.style.color = isDark ? "rgba(255, 255, 255, 1)" : "rgba(27, 31, 59, 1)";
            loader.innerHTML = svg;
            loader.classList.add("visible");
          });
      })();
    </script>
  </body>
  <style>
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .loader.visible {
      opacity: 1;
    }
    .loader svg {
      width: 8rem;
      height: auto;
      animation: fade 1.6s infinite ease-in-out;
      opacity: 0.8;
    }
    @keyframes fade {
      0% {
        opacity: 0.3;
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0.3;
      }
    }
  </style>
</html>
