<div
  class="ui-input"
  [class.ui-input--sm]="size === 'sm'"
  [class.ui-input--md]="size === 'md'"
  [class.ui-input--lg]="size === 'lg'"
  [class.ui-input--disabled]="disabled"
  [class.ui-input--invalid]="invalid"
  [class.ui-input--readonly]="readonly"
>
  <span class="ui-input__prefix">
    <ng-content select="[uiInputPrefix]" />
  </span>

  <input
    #inputElement
    class="ui-input__control"
    [id]="inputId || null"
    [type]="nativeType"
    [name]="name || null"
    [value]="value ?? ''"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete || null"
    [required]="required"
    [disabled]="disabled"
    [readOnly]="readonly"
    [attr.min]="min"
    [attr.max]="max"
    [attr.step]="step"
    [attr.maxlength]="maxLength"
    [attr.minlength]="minLength"
    [attr.aria-label]="ariaLabel || null"
    [attr.aria-describedby]="ariaDescribedBy || null"
    [attr.aria-invalid]="invalid ? 'true' : null"
    (input)="handleInput(inputElement.value)"
    (blur)="handleBlur()"
  />

  @if (canClear) {
  <button class="ui-input__action" type="button" (click)="clear(inputElement)">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  </button>
  } @if (canTogglePassword) {
  <button
    class="ui-input__action"
    type="button"
    [attr.aria-pressed]="passwordVisible"
    (click)="togglePasswordVisibility()"
  >
    @if (passwordVisible) {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 3 21 21" />
      <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
      <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c5 0 8.5 4.5 9.5 7-.4 1-1.2 2.1-2.2 3.1" />
      <path d="M6.2 6.2C3.9 7.7 2.7 10 2.5 12c1 2.5 4.5 7 9.5 7 1 0 2-.2 2.9-.5" />
    </svg>
    } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z" />
      <circle cx="12" cy="12" r="3" />
    </svg>
    }
  </button>
  }

  <span class="ui-input__suffix">
    <ng-content select="[uiInputSuffix]" />
  </span>
</div>
