<div
  class="ui-form-field"
  [class.ui-form-field--error]="hasError"
  [class.ui-form-field--disabled]="disabled"
>
  @if (label) {
  <label class="ui-form-field__label" [attr.for]="controlId || null">
    {{ label }}

    @if (required) {
    <span class="ui-form-field__required" aria-hidden="true">*</span>
    }
  </label>
  }

  <div class="ui-form-field__control">
    <ng-content />
  </div>

  @if (hasError) {
  <span
    class="ui-form-field__message ui-form-field__message--error"
    [id]="errorId || null"
    role="alert"
  >
    {{ error }}
  </span>
  } @else if (hint) {
  <span class="ui-form-field__message ui-form-field__message--hint" [id]="hintId || null">
    {{ hint }}
  </span>
  }
</div>
