<aside class="sidebar">
  <header class="logo">
    <tui-icon icon="@tui.house" class="logo-icon" />
    <span class="logo-title">{{ "common.title" | transloco }}</span>
  </header>

  <nav class="nav">
    @for (item of items(); track item.link) {
    <a class="nav-item" routerLinkActive="active" [routerLink]="'/' + item.link">
      <tui-icon [icon]="item.icon" />
      <span>{{ item.label | transloco }}</span>
    </a>
    }
  </nav>

  <footer class="footer">
    <div class="settings">
      <lifeos-theme-switcher />
      <lifeos-language-switcher />
    </div>

    <a class="help" href="https://t.me/khimovsky">
      <span>{{ "layouts.basic.sidebar.help.write" | transloco }}</span>
      <tui-icon icon="@tui.arrow-up-right" />
    </a>
  </footer>
</aside>
