<tui-badged-content>
  <img
    alt=""
    size="s"
    tuiBadge
    tuiSlot="bottom"
    [src]="flags.get(language.value ?? '') || flags.get(switcher.language) | tuiFlag"
  />
  <button
    type="button"
    appearance="outline-grayscale"
    size="s"
    tuiButtonSelect
    tuiIconButton
    [formControl]="language"
    [iconStart]="icons.languages"
  >
    <tui-data-list *tuiTextfieldDropdown>
      <tui-opt-group [label]="'components.language.label' | transloco">
        @for (name of names; track name) {
        <button new tuiOption type="button" [value]="name" (click)="setLang(name)">
          <img alt="" class="t-flag" [src]="flags.get(name) | tuiFlag" />
          {{ "components.language." + name | transloco | titlecase }}
        </button>
        }
      </tui-opt-group>
    </tui-data-list>
  </button>
</tui-badged-content>
